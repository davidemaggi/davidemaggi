<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="Davide avatar glitch">
  <defs>
    <clipPath id="clipCircle">
      <circle cx="140" cy="140" r="112"/>
    </clipPath>

    <filter id="glitchDisplace" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="3" result="noise">
        <animate attributeName="baseFrequency" dur="2.4s" values="0.8;1.1;0.7;1.0;0.8" repeatCount="indefinite"/>
        <animate attributeName="seed" dur="0.45s" values="3;9;4;12;3" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0">
        <animate attributeName="scale" dur="0.35s" values="0;0;0;4;0;0;6;0" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </defs>

  <circle cx="140" cy="140" r="120" fill="#0d1117"/>

  <g clip-path="url(#clipCircle)" filter="url(#glitchDisplace)">
    <image href="https://avatars.githubusercontent.com/u/6232921?v=4" x="28" y="28" width="224" height="224" preserveAspectRatio="xMidYMid slice"/>

    <image href="https://avatars.githubusercontent.com/u/6232921?v=4" x="28" y="28" width="224" height="224" opacity="0.12" preserveAspectRatio="xMidYMid slice">
      <animate attributeName="x" dur="0.45s" values="28;27;29;28" repeatCount="indefinite"/>
    </image>

    <image href="https://avatars.githubusercontent.com/u/6232921?v=4" x="28" y="28" width="224" height="224" opacity="0.09" preserveAspectRatio="xMidYMid slice">
      <animate attributeName="y" dur="0.38s" values="28;27;30;28" repeatCount="indefinite"/>
    </image>
  </g>

  <g opacity="0.25">
    <rect x="28" y="40" width="224" height="3" fill="#58a6ff">
      <animate attributeName="y" dur="2.2s" values="40;240;40" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="0.2s" values="0;0.35;0" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="72" width="224" height="2" fill="#f778ba">
      <animate attributeName="y" dur="1.6s" values="72;225;72" repeatCount="indefinite"/>
      <animate attributeName="opacity" dur="0.16s" values="0;0.28;0" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="140" cy="140" r="112" fill="none" stroke="#58a6ff" stroke-opacity="0.7" stroke-width="2">
    <animate attributeName="stroke-opacity" dur="1.2s" values="0.55;1;0.55" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="140" r="120" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
